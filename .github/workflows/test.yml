name: Test integration without sending or importing
permissions:
  contents: read
on:
  workflow_dispatch:

jobs:
  calculate-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      #  with:
      #    repository: ${{ vars.REPOSITORY }}
      #    ref: ${{ vars.REF }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v7.1.4


      - name: Verify journal filters, Zotero deduplication and API-free execution
        run: |
          PYTHONPATH=src uv run --locked python -m unittest discover -s verification -v
